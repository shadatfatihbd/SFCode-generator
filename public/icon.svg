<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sfcode-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0056B3"/>
    </linearGradient>
    <linearGradient id="sfcode-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F1FF"/>
    </linearGradient>
  </defs>
  <!-- Squircle rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sfcode-bg)"/>
  
  <!-- Outer Finder Pattern Bracket (Top Left) -->
  <rect x="80" y="80" width="130" height="130" rx="30" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <rect x="115" y="115" width="60" height="60" rx="14" fill="#FFFFFF"/>
  
  <!-- Outer Finder Pattern Bracket (Top Right) -->
  <rect x="302" y="80" width="130" height="130" rx="30" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <rect x="337" y="115" width="60" height="60" rx="14" fill="#FFFFFF"/>
  
  <!-- Outer Finder Pattern Bracket (Bottom Left) -->
  <rect x="80" y="302" width="130" height="130" rx="30" fill="none" stroke="#FFFFFF" stroke-width="24"/>
  <rect x="115" y="337" width="60" height="60" rx="14" fill="#FFFFFF"/>

  <!-- Center Stylized 'SF' & Code Elements -->
  <path d="M 230 190 Q 256 160 282 190 Q 295 205 285 220 L 245 270 Q 235 285 250 300 Q 268 318 290 295" 
        fill="none" stroke="url(#sfcode-accent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Barcode Vertical Elements (Bottom Right Matrix) -->
  <rect x="302" y="302" width="18" height="130" rx="9" fill="#FFFFFF"/>
  <rect x="334" y="302" width="28" height="130" rx="10" fill="#FFFFFF"/>
  <rect x="376" y="302" width="14" height="130" rx="7" fill="#FFFFFF"/>
  <rect x="404" y="302" width="28" height="130" rx="10" fill="#FFFFFF"/>
</svg>
